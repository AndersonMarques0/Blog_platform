version: "3.8"

services:
  frontend:
    image: rudeusdocker/blog-platform-frontend:prod
    ports:
      - target: 80
        published: 8082
        protocol: tcp
        mode: ingress
    networks:
      - app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

  api:
    image: rudeusdocker/blog-platform-api:prod
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    networks:
      - app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512m
          cpus: "0.50"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == vivobook15
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
          cpus: "0.50"

networks:
  app-net:
    driver: overlay

volumes:
  db-data:
