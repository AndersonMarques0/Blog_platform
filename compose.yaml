services:
  frontend:
    image: blog-platform-frontend:prod
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 128m
    cpus: 0.50
    ports:
      - "8084:80"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

  api:
    image: blog-platform-api:prod
    build:
      context: ./server
      dockerfile: Dockerfile
    mem_limit: 512m
    cpus: 1.00
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      PORT: "3001"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17
    mem_limit: 1g
    cpus: 1.00
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: blog-platform-prod

volumes:
  postgres_data:
    external: true
    name: blog_platform_postgres_data
