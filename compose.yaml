services:
  manager:
    image: docker:29-dind
    privileged: true
    hostname: manager
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --tls=false
    volumes:
      - manager-data:/var/lib/docker
    networks:
      swarm-net:
        ipv4_address: 172.30.250.10
    ports:
      - "127.0.0.1:23750:2375"
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8083:8082"

  worker1:
    image: docker:29-dind
    privileged: true
    hostname: worker1
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --tls=false
    volumes:
      - worker1-data:/var/lib/docker
    networks:
      swarm-net:
        ipv4_address: 172.30.250.11

  worker2:
    image: docker:29-dind
    privileged: true
    hostname: worker2
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --tls=false
    volumes:
      - worker2-data:/var/lib/docker
    networks:
      swarm-net:
        ipv4_address: 172.30.250.12

networks:
  swarm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  manager-data:
  worker1-data:
  worker2-data:
